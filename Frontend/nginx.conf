# =========================================================
# CAMPUSLAB - NGINX
# Dominio: campuslab.ddns.net
# =========================================================


# =========================================================
# HTTP -> HTTPS
# =========================================================
server {
    listen 80;
    listen [::]:80;

    server_name campuslab.ddns.net;

    return 301 https://$host$request_uri;
}


# =========================================================
# HTTPS
# =========================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name campuslab.ddns.net;


    # =====================================================
    # SSL
    # =====================================================
    ssl_certificate /etc/letsencrypt/live/campuslab.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campuslab.ddns.net/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers off;


    # =====================================================
    # HEADERS DE SEGURIDAD
    # =====================================================
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;


    # =====================================================
    # RUNTIME CONFIG
    # =====================================================
    location = /runtime-config.js {
        proxy_pass http://127.0.0.1:4200/runtime-config.js;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }


    # =====================================================
    # API CATALOG - 8081
    # =====================================================
    location /api/catalog/ {
        proxy_pass http://127.0.0.1:8081;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }


    # =====================================================
    # API BOOKINGS - 8082
    # =====================================================
    location /api/bookings/ {
        proxy_pass http://127.0.0.1:8082;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }


    # =====================================================
    # API REPORT - 8085
    # =====================================================
    location /api/report/ {
        proxy_pass http://127.0.0.1:8085;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }


    # =====================================================
    # API AUDIT - 8083
    # =====================================================
    location /api/audit/ {
        proxy_pass http://127.0.0.1:8083;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }


    # =====================================================
    # API BASE - 8080
    # =====================================================
    location /api/ {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }


    # =====================================================
    # FRONTEND ANGULAR
    # =====================================================
    location / {
        proxy_pass http://127.0.0.1:4200;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }
}