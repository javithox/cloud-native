<div class="app-shell">
  @if (authService.isLoggedIn()) {
    <header class="topbar">
      <button type="button" class="menu-toggle" aria-label="Abrir menú" (click)="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="topbar-brand">
        <span class="brand-mark">C</span>
        <div>
          <strong>CampusLab</strong>
          <small>{{ authService.getRoleDefinition().label }}</small>
        </div>
      </div>
    </header>

    <aside class="sidebar" [class.sidebar-open]="menuOpen">
      <div class="brand">
        <span class="brand-mark">C</span>
        <div>
          <strong>CampusLab</strong>
          <small>{{ authService.getRoleDefinition().label }}</small>
        </div>
      </div>

      <nav class="nav">
        @for (item of visibleNavItems(); track item.path) {
          <a [routerLink]="item.path" routerLinkActive="active" (click)="closeMenu()">{{ item.label }}</a>
        }
      </nav>

      <button type="button" class="logout" (click)="logout()">Cerrar sesión</button>
    </aside>
  }

  <main class="content-shell" [class.content-shell-shifted]="authService.isLoggedIn() && menuOpen">
    <router-outlet />
  </main>
</div>
