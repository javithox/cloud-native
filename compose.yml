
networks:
  campuslab-net:
    driver: bridge

services:
  postgres:
    image: postgres:15-alpine
    container_name: campuslab-postgres
    environment:
      POSTGRES_MULTIPLE_DATABASES: campuslab_catalog,campuslab_bookings,campuslab_audit,campuslab_report
      POSTGRES_USER: campuslab
      POSTGRES_PASSWORD: campuslab
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init-multiple-dbs.sql:/docker-entrypoint-initdb.d/init-multiple-dbs.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campuslab"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - campuslab-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: campuslab-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - campuslab-net

  kafka:
    image: apache/kafka:3.9.0
    container_name: campuslab-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - campuslab-net

  ms-campuslab-catalog:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: ms-campuslab-catalog
    container_name: ms-campuslab-catalog
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: campuslab_catalog
      DB_USERNAME: campuslab
      DB_PASSWORD: campuslab
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - campuslab-net

  ms-campuslab-bookings:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: ms-campuslab-bookings
    container_name: ms-campuslab-bookings
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: campuslab_bookings
      DB_USERNAME: campuslab
      DB_PASSWORD: campuslab
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - campuslab-net

  ms-campuslab-audit:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: ms-campuslab-audit
    container_name: ms-campuslab-audit
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: campuslab_audit
      DB_USERNAME: campuslab
      DB_PASSWORD: campuslab
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - campuslab-net

  ms-campuslab-report:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: ms-campuslab-report
    container_name: ms-campuslab-report
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: campuslab_report
      DB_USERNAME: campuslab
      DB_PASSWORD: campuslab
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - campuslab-net

  ms-campuslab-notify:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: ms-campuslab-notify
    container_name: ms-campuslab-notify
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8084
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
    depends_on:
      rabbitmq:
        condition: service_started
    networks:
      - campuslab-net

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: campuslab-frontend
    ports:
      - "4200:4200"
    depends_on:
      - ms-campuslab-catalog
      - ms-campuslab-bookings
      - ms-campuslab-audit
      - ms-campuslab-report
      - ms-campuslab-notify
    networks:
      - campuslab-net

volumes:
  postgres_data: