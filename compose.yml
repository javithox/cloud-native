
networks:
  campuslab-net:
    driver: bridge

services:
  postgres:
    image: postgres:15-alpine
    container_name: campuslab-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campuslab}
      POSTGRES_USER: ${POSTGRES_USER:-campuslab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campuslab}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./docker/postgres/init-multiple-dbs.sql:/docker-entrypoint-initdb.d/init-multiple-dbs.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - campuslab-net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: campuslab-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    networks:
      - campuslab-net
  kafka:
    image: apache/kafka:3.9.0
    container_name: campuslab-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://campuslab-kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@campuslab-kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1

    networks:
      - campuslab-net

  ms-campuslab-catalog:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE_NAME: ms-campuslab-catalog
    container_name: ms-campuslab-catalog
    ports:
      - "${CATALOG_PORT:-8081}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_SECURITY_ENABLED: ${APP_SECURITY_ENABLED:-false}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: campuslab_catalog
      DB_USERNAME: ${POSTGRES_USER:-campuslab}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-campuslab}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - campuslab-net

  ms-campuslab-bookings:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE_NAME: ms-campuslab-bookings
    container_name: ms-campuslab-bookings
    ports:
      - "${BOOKINGS_PORT:-8082}:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_SECURITY_ENABLED: ${APP_SECURITY_ENABLED:-false}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CAMPUSLAB_CATALOG_BASE_URL: http://ms-campuslab-catalog:8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: campuslab_bookings
      DB_USERNAME: ${POSTGRES_USER:-campuslab}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-campuslab}
      TENANT_ID: ${TENANT_ID:-bda559f7-26d8-4062-88a2-da66f2286b5f}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-api://e03479f6-d22d-4624-aa81-6e724d570329}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - campuslab-net

  ms-campuslab-audit:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE_NAME: ms-campuslab-audit
    container_name: ms-campuslab-audit
    ports:
      - "${AUDIT_PORT:-8083}:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_SECURITY_ENABLED: ${APP_SECURITY_ENABLED:-false}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: campuslab_audit
      DB_USERNAME: ${POSTGRES_USER:-campuslab}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-campuslab}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - campuslab-net

  ms-campuslab-report:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE_NAME: ms-campuslab-report
    container_name: ms-campuslab-report
    ports:
      - "${REPORT_PORT:-8085}:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_SECURITY_ENABLED: ${APP_SECURITY_ENABLED:-false}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: campuslab_report
      DB_USERNAME: ${POSTGRES_USER:-campuslab}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-campuslab}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - campuslab-net

  ms-campuslab-notify:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE_NAME: ms-campuslab-notify
    container_name: ms-campuslab-notify
    ports:
      - "${NOTIFY_PORT:-8084}:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8084
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    depends_on:
      rabbitmq:
        condition: service_started
    networks:
      - campuslab-net

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: campuslab-frontend
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    environment:
      API_CATALOG_URL: ${API_CATALOG_URL:-http://localhost:8081/api/catalog/}
      API_BOOKINGS_URL: ${API_BOOKINGS_URL:-http://localhost:8082/api/bookings/}
      API_AUDIT_URL: ${API_AUDIT_URL:-http://localhost:8083/api/audit/}
      API_REPORT_URL: ${API_REPORT_URL:-http://localhost:8085/api/report/}
    depends_on:
      - ms-campuslab-catalog
      - ms-campuslab-bookings
      - ms-campuslab-audit
      - ms-campuslab-report
      - ms-campuslab-notify
    networks:
      - campuslab-net

volumes:
  postgres_data:
