services:
  postgres:
    image: postgres:16-alpine
    container_name: campuslab-postgres
    environment:
      POSTGRES_DB: campuslab
      POSTGRES_USER: campuslab
      POSTGRES_PASSWORD: campuslab
    # Limita el uso de buffers compartidos en Postgres para ahorrar RAM
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=30"]
    ports:
      - "5432:5432"
    volumes:
      - campuslab-postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 200M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campuslab -d campuslab"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: campuslab-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - campuslab-rabbitmq-data:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          memory: 200M

  kafka:
    image: apache/kafka:3.9.0
    container_name: campuslab-kafka
    ports:
      - "9092:9092"
    environment:
      # Restringe la memoria del Heap de la JVM de Kafka entre 128MB y 256MB
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - campuslab-kafka-data:/tmp/kraft-combined-logs
    deploy:
      resources:
        limits:
          memory: 350M

volumes:
  campuslab-postgres-data:
  campuslab-rabbitmq-data:
  campuslab-kafka-data:
