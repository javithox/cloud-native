server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: ms-campuslab-notify

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual # ACK/NACK explícitos
        retry:
          enabled: true
          max-attempts: 3
