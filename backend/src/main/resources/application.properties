spring.application.name=backend
spring.application.name=backend
server.port=8080

# Base de datos Cloud (AWS RDS PostgreSQL / Oracle)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:pedidos360}
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Validación de Tokens JWT emitidos por Azure AD
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${TENANT_ID:aaaa-bbbb-cccc-dddd}/v2.0

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/TU_TENANT_ID/v2.0