server:
  port: ${SERVER_PORT:8087}
spring:
  application:
    name: ms-campuslab-kafka-admin
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      properties:
        request.timeout.ms: 10000
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:https://login.microsoftonline.com/${TENANT_ID:bda559f7-26d8-4062-88a2-da66f2286b5f}/v2.0}
management:
  endpoints:
    web:
      exposure:
        include: health,info
campuslab:
  security:
    jwt:
      audience: ${JWT_AUDIENCE:api://e03479f6-d22d-4624-aa81-6e724d570329}
  kafka:
    topic-replication-factor: ${KAFKA_TOPIC_REPLICATION_FACTOR:3}
    topic-partitions: ${KAFKA_TOPIC_PARTITIONS:3}
