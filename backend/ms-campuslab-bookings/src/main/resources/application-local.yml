server:
  port: 8082

spring:
  application:
    name: ms-campuslab-bookings
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campuslab_bookings}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:campuslab}
    password: ${DB_PASSWORD:campuslab}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://login.microsoftonline.com/${TENANT_ID:bda559f7-26d8-4062-88a2-da66f2286b5f}/discovery/keys

campuslab:
  catalog:
    base-url: ${CATALOG_BASE_URL:http://localhost:8081}
  rabbitmq:
    exchanges:
      direct: booking.direct.exchange
      topic: booking.topic.exchange
      dlx: booking.dlx.exchange
  kafka:
    topics:
      booking-events: booking-events-topic
  security:
    jwt:
      audience: ${JWT_AUDIENCE:api://e03479f6-d22d-4624-aa81-6e724d570329}

# Seguridad DESHABILITADA para desarrollo local
app:
  security:
    enabled: false
