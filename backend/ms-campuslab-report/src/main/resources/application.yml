server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: ms-campuslab-report
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campuslab_report}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:campuslab}
    password: ${DB_PASSWORD:campuslab}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: campuslab-report-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

campuslab:
  kafka:
    topics:
      booking-events: booking-events-topic
