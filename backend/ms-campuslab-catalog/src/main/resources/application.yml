server:
  port: 8081

spring:
  application:
    name: ms-campuslab-catalog
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campuslab_catalog}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:campuslab}
    password: ${DB_PASSWORD:campuslab}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

campuslab:
  rabbitmq:
    exchanges:
      direct: catalog.direct.exchange
      topic: catalog.topic.exchange
      dlx: catalog.dlx.exchange
  kafka:
    topics:
      catalog-events: catalog-events-topic
